services:
  go-txmlconnector:
    build:
      context: .
      dockerfile: Dockerfile
    image: go-txmlconnector:local
    platform: linux/amd64
    init: true
    # Deliberately no restart policy: unknown outcomes require reconciliation.
    stop_grace_period: 20s
    mem_limit: 1g
    ports:
      - "127.0.0.1:50052:50051"
      - "127.0.0.1:9092:9090"
    volumes:
      - go-txmlconnector-state:/var/lib/txml

volumes:
  go-txmlconnector-state:
